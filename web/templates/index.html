<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志查询 - Log Search</title>
  <link rel="icon" href="/static/img/favicon.ico" sizes="16x16 32x32 48x48 256x256">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/logo-ls.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/vendor/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1 class="brand"><img class="brand-logo" src="/static/img/logo-ls.png" width="32" height="32" alt="">日志查询</h1>
    {{if .namespaces}}
    <div class="env-tabs namespace-tabs" id="namespace-tabs" aria-label="平台切换">
      {{range .namespaces}}<button type="button" class="env-tab" data-value="{{.Value}}"{{if .Description}} title="{{.Description}}"{{end}}>{{.Label}}</button>{{end}}
    </div>
    {{end}}
    <div class="header-actions">
      <button type="button" id="share" class="theme-toggle share-toggle" title="复制分享链接" aria-label="复制分享链接">
        <svg class="share-icon-copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20c2.5-7.5 7.5-11 15-11"></path>
          <path d="M14 4l6 5-6 5"></path>
        </svg>
        <svg class="share-icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      {{template "display-settings" .}}
    </div>
  </header>
  <main>
    <section class="controls">
      <div class="row filter-tabs-row">
        <div class="env-tabs level-tabs" id="level-tabs">
          <button class="env-tab" data-value="debug">DEBUG</button>
          <button class="env-tab" data-value="info">INFO</button>
          <button class="env-tab" data-value="warn">WARN</button>
          <button class="env-tab" data-value="error">ERROR</button>
        </div>
        <div class="env-tabs direction-tabs" id="direction-tabs">
          <button class="env-tab" data-value="BACKWARD">倒序</button>
          <button class="env-tab" data-value="FORWARD">正序</button>
        </div>
        <div class="env-tabs" id="env-tabs">
          {{if .namespaces}}
          {{range .namespaces}}{{$namespace := .Value}}{{range .Envs}}<button type="button" class="env-tab" data-namespace="{{$namespace}}" data-value="{{.Value}}">{{.Label}}</button>{{end}}{{end}}
          {{else}}
          {{range .envs}}<button type="button" class="env-tab" data-value="{{.Value}}">{{.Label}}</button>{{end}}
          {{end}}
        </div>
      </div>
      <div class="row query-row">
        <label><span class="lbl">应用</span>
          <span class="clear-field clear-field-select">
            <select id="app-select">
              <option value="">不限</option>
              {{if .namespaces}}
              {{range .namespaces}}{{$namespace := .Value}}{{range .Envs}}{{$env := .Value}}{{range .Apps}}<option data-namespace="{{$namespace}}" data-env="{{$env}}" value="{{.Name}}" title="{{.Repo}}">{{.Name}}</option>{{end}}{{end}}{{end}}
              {{else}}{{range .envs}}{{$env := .Value}}{{range .Apps}}<option data-env="{{$env}}" value="{{.Name}}" title="{{.Repo}}">{{.Name}}</option>{{end}}{{end}}{{end}}
            </select>
            <button type="button" id="app-clear" class="clear-icon" title="清除应用筛选" aria-label="清除应用筛选" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <div class="time-field">
          <span class="lbl">时间</span>
          <span class="time-inputs">
            <input type="datetime-local" id="start" title="开始时间">
            <span class="time-sep">~</span>
            <input type="datetime-local" id="end" title="结束时间">
          </span>
          <span class="time-shortcuts">
            <button type="button" class="time-shortcut" data-range="1h">1h</button>
            <button type="button" class="time-shortcut" data-range="3h">3h</button>
            <button type="button" class="time-shortcut" data-range="today">今天</button>
          </span>
        </div>
      </div>
      <div class="row query-row">
        <label><span class="lbl">链路id</span>
          <span class="clear-field">
            <input type="text" id="trace-id" placeholder="链路id">
            <button type="button" id="trace-id-clear" class="clear-icon" title="清除" aria-label="清除链路id" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label><span class="lbl">线程任务id</span>
          <span class="clear-field">
            <input type="text" id="task-id" placeholder="线程任务id">
            <button type="button" id="task-id-clear" class="clear-icon" title="清除" aria-label="清除线程任务id" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label><span class="lbl">MQ消息id</span>
          <span class="clear-field">
            <input type="text" id="message-id" placeholder="MQ消息id">
            <button type="button" id="message-id-clear" class="clear-icon" title="清除" aria-label="清除MQ消息id" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
      </div>
      <div class="row query-row">
        <label><span class="lbl">关键词</span>
          <span class="clear-field">
            <input type="text" id="keyword" placeholder="匹配日志文本,如 error、timeout && retry、timeout || failed">
            <button type="button" id="keyword-clear" class="clear-icon" title="清除" aria-label="清除关键词" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <button type="button" id="search">查询</button>
        <button type="button" id="span-filters-toggle" aria-expanded="false" aria-controls="span-filters-row" aria-label="展开 Span 筛选" title="展开 Span 筛选">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 7 6 6 6-6M6 13l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="row query-row" id="span-filters-row" hidden>
        <label id="span-id-field"><span class="lbl">SpanId</span>
          <span class="clear-field">
            <input type="text" id="span-id" placeholder="SpanId">
            <button type="button" id="span-id-clear" class="clear-icon" title="清除" aria-label="清除SpanId" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label id="parent-span-id-field"><span class="lbl">ParentSpanId</span>
          <span class="clear-field">
            <input type="text" id="parent-span-id" placeholder="ParentSpanId">
            <button type="button" id="parent-span-id-clear" class="clear-icon" title="清除" aria-label="清除ParentSpanId" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
      </div>
    </section>

    <section id="error-bar" class="error" hidden></section>
    <div class="scroll-area" id="scroll-area">
      <section class="chart-wrap"><canvas id="chart" height="80"></canvas></section>
      <section id="results" class="results"></section>
    </div>
  </main>
  <div id="query-loading" class="query-loading" role="status" aria-live="polite" hidden>
    <div class="query-loading-card">
      <span class="query-loading-spinner" aria-hidden="true"></span>
      <span>正在查询日志…</span>
    </div>
  </div>
  <script src="/static/js/levels.js"></script>
  <script src="/static/js/share.js"></script>
  <script src="/static/js/trace.js"></script>
  <script src="/static/js/keyboard.js"></script>
  <script src="/static/js/timeRange.js"></script>
  <script src="/static/js/pagination.js"></script>
  <script src="/static/js/display.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
