<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志查询 - Log Search</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>日志查询</h1>
    {{if .namespaces}}
    <div class="env-tabs namespace-tabs" id="namespace-tabs" aria-label="平台切换">
      {{range .namespaces}}<button type="button" class="env-tab" data-value="{{.Value}}"{{if .Description}} title="{{.Description}}"{{end}}>{{.Label}}</button>{{end}}
    </div>
    {{end}}
    <div class="header-actions">
      <button type="button" id="share" class="theme-toggle share-toggle" title="复制分享链接" aria-label="复制分享链接">
        <svg class="share-icon-copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20c2.5-7.5 7.5-11 15-11"></path>
          <path d="M14 4l6 5-6 5"></path>
        </svg>
        <svg class="share-icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <button type="button" id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换主题">
        <svg class="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>
  <main>
    <section class="controls">
      <div class="row">
        <div class="env-tabs level-tabs" id="level-tabs">
          <button class="env-tab" data-value="debug">DEBUG</button>
          <button class="env-tab" data-value="info">INFO</button>
          <button class="env-tab" data-value="warn">WARN</button>
          <button class="env-tab" data-value="error">ERROR</button>
        </div>
        <div class="env-tabs direction-tabs" id="direction-tabs">
          <button class="env-tab" data-value="BACKWARD">倒序</button>
          <button class="env-tab" data-value="FORWARD">正序</button>
        </div>
        <div class="env-tabs" id="env-tabs">
          {{range .envs}}<button class="env-tab" data-value="{{.Value}}">{{.Label}}</button>{{end}}
        </div>
      </div>
      <div class="row query-row">
        <label><span class="lbl">应用</span>
          <span class="clear-field clear-field-select">
            <select id="app-select">
              <option value="">不限</option>
              {{if .namespaces}}
              {{range .namespaces}}{{$namespace := .Value}}{{range .Apps}}<option data-namespace="{{$namespace}}" value="{{.}}">{{.}}</option>{{end}}{{end}}
              {{else}}{{range .apps}}<option value="{{.}}">{{.}}</option>{{end}}{{end}}
            </select>
            <button type="button" id="app-clear" class="clear-icon" title="清除应用筛选" aria-label="清除应用筛选" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <div class="time-field">
          <span class="lbl">时间</span>
          <span class="time-inputs">
            <input type="datetime-local" id="start" title="开始时间">
            <span class="time-sep">~</span>
            <input type="datetime-local" id="end" title="结束时间">
          </span>
          <span class="time-shortcuts">
            <button type="button" class="time-shortcut" data-range="1h">1h</button>
            <button type="button" class="time-shortcut" data-range="3h">3h</button>
            <button type="button" class="time-shortcut" data-range="today">今天</button>
          </span>
        </div>
        <label><span class="lbl">TraceId</span>
          <span class="clear-field">
            <input type="text" id="trace-id" placeholder="TraceId">
            <button type="button" id="trace-id-clear" class="clear-icon" title="清除" aria-label="清除链路id" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label><span class="lbl">SpanId</span>
          <span class="clear-field">
            <input type="text" id="span-id" placeholder="SpanId">
            <button type="button" id="span-id-clear" class="clear-icon" title="清除" aria-label="清除SpanId" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label><span class="lbl">父级SpanId</span>
          <span class="clear-field">
            <input type="text" id="parent-span-id" placeholder="父级SpanId">
            <button type="button" id="parent-span-id-clear" class="clear-icon" title="清除" aria-label="清除父级SpanId" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label><span class="lbl">TaskId</span>
          <span class="clear-field">
            <input type="text" id="task-id" placeholder="TaskId">
            <button type="button" id="task-id-clear" class="clear-icon" title="清除" aria-label="清除TaskId" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label><span class="lbl">MessageId</span>
          <span class="clear-field">
            <input type="text" id="message-id" placeholder="MessageId">
            <button type="button" id="message-id-clear" class="clear-icon" title="清除" aria-label="清除MessageId" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <label><span class="lbl">关键词</span>
          <span class="clear-field">
            <input type="text" id="keyword" placeholder="匹配日志文本,如 error、timeout && retry、timeout || failed">
            <button type="button" id="keyword-clear" class="clear-icon" title="清除" aria-label="清除关键词" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </span>
        </label>
        <button type="button" id="search">查询</button>
      </div>
    </section>

    <section id="error-bar" class="error" hidden></section>
    <div class="scroll-area" id="scroll-area">
      <section class="chart-wrap"><canvas id="chart" height="80"></canvas></section>
      <section id="results" class="results"></section>
    </div>
  </main>
  <script src="/static/levels.js"></script>
  <script src="/static/share.js"></script>
  <script src="/static/trace.js"></script>
  <script src="/static/keyboard.js"></script>
  <script src="/static/timeRange.js"></script>
  <script src="/static/pagination.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
