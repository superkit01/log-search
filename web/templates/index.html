<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志查询 - Log Search</title>
  <link rel="icon" href="/static/img/favicon.ico" sizes="16x16 32x32 48x48 256x256">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/logo-ls.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/vendor/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1><a class="brand" href="/"><img class="brand-logo" src="/static/img/logo-ls.png" width="32" height="32" alt="">日志查询</a></h1>
    {{if .namespaces}}
    <div class="env-tabs namespace-tabs" id="namespace-tabs" aria-label="平台切换">
      {{range .namespaces}}<button type="button" class="env-tab" data-value="{{.Value}}"{{if .Description}} title="{{.Description}}"{{end}}>{{.Label}}</button>{{end}}
    </div>
    {{end}}
    <div class="header-actions">
      <button type="button" id="share" class="theme-toggle share-toggle" title="复制分享链接" aria-label="复制分享链接">
        <svg class="share-icon-copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <svg class="share-icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      {{template "display-settings" .}}
    </div>
  </header>
  <main>
    <aside class="controls" aria-label="查询侧栏">
      <div class="sidebar-heading">
        <button type="button" id="sidebar-toggle" class="theme-toggle" aria-expanded="true" aria-controls="sidebar-filters" aria-label="收起查询条件" title="收起查询条件">
          <svg class="sidebar-panel-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M9 4v16"/>
          </svg>
          <svg class="sidebar-expand-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 17 5-5-5-5m7 10 5-5-5-5"/>
          </svg>
          <span>查询条件</span>
        </button>
      </div>
      <div id="sidebar-filters" class="sidebar-filters">
        <div class="sidebar-fields">
          <div class="filter-group">
            <div class="sort-field">
              <span id="sort-label">排序</span>
              <div class="env-tabs" id="direction-tabs" role="group" aria-labelledby="sort-label">
                <button type="button" class="env-tab active" data-value="BACKWARD" aria-pressed="true">倒序</button>
                <button type="button" class="env-tab" data-value="FORWARD" aria-pressed="false">正序</button>
              </div>
            </div>
            <span class="lbl" id="env-label">环境</span>
            <div class="env-tabs" id="env-tabs" role="group" aria-labelledby="env-label">
              {{if .namespaces}}
              {{range .namespaces}}{{$namespace := .Value}}{{range .Envs}}<button type="button" class="env-tab" data-namespace="{{$namespace}}" data-value="{{.Value}}">{{.Label}}</button>{{end}}{{end}}
              {{else}}
              {{range .envs}}<button type="button" class="env-tab" data-value="{{.Value}}">{{.Label}}</button>{{end}}
              {{end}}
            </div>
            <div class="app-picker" id="app-picker">
              <span class="lbl" id="app-label">应用</span>
              <div class="clear-field app-trigger">
                <button type="button" id="app-toggle" class="app-toggle" aria-expanded="false" aria-controls="app-panel" aria-labelledby="app-label app-value">
                  <span id="app-value">不限</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <button type="button" id="app-clear" class="clear-icon" title="清除应用筛选" aria-label="清除应用筛选" hidden>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                  </svg>
                </button>
              </div>
              <div class="app-panel" id="app-panel" hidden inert>
                <div class="app-panel-clip">
                  <div class="app-panel-content">
                    <input type="search" id="app-filter" aria-label="筛选应用" placeholder="搜索应用名或仓库" autocomplete="off">
                    <div class="app-options" id="app-options" role="group" aria-label="应用选项"></div>
                    <p id="app-empty" class="app-empty" role="status" hidden>没有匹配的应用</p>
                  </div>
                </div>
              </div>
              <select id="app-select" hidden>
                <option value="">不限</option>
                {{if .namespaces}}
                {{range .namespaces}}{{$namespace := .Value}}{{range .Envs}}{{$env := .Value}}{{range .Apps}}<option data-namespace="{{$namespace}}" data-env="{{$env}}" value="{{.Name}}" title="{{.Repo}}">{{.Name}}</option>{{end}}{{end}}{{end}}
                {{else}}{{range .envs}}{{$env := .Value}}{{range .Apps}}<option data-env="{{$env}}" value="{{.Name}}" title="{{.Repo}}">{{.Name}}</option>{{end}}{{end}}{{end}}
              </select>
            </div>
          </div>
          <div class="filter-group" role="group" aria-labelledby="time-label">
            <span class="lbl" id="time-label">时间范围</span>
            <div class="time-shortcuts">
              <button type="button" class="time-shortcut" data-range="1h">1h</button>
              <button type="button" class="time-shortcut" data-range="3h">3h</button>
              <button type="button" class="time-shortcut" data-range="today">今天</button>
            </div>
            <label class="time-field"><span>开始</span>
              <span class="time-control">
                <input type="datetime-local" id="start">
                <span class="time-roll" aria-hidden="true" hidden><span class="time-roll-line"></span></span>
              </span>
            </label>
            <label class="time-field"><span>结束</span>
              <span class="time-control">
                <input type="datetime-local" id="end">
                <span class="time-roll" aria-hidden="true" hidden><span class="time-roll-line"></span></span>
              </span>
            </label>
          </div>
          <div class="filter-group">
            <span class="lbl" id="level-label">日志级别</span>
            <div class="env-tabs" id="level-tabs" role="group" aria-labelledby="level-label">
              <button type="button" class="env-tab" data-value="debug">DEBUG</button>
              <button type="button" class="env-tab" data-value="info">INFO</button>
              <button type="button" class="env-tab" data-value="warn">WARN</button>
              <button type="button" class="env-tab" data-value="error">ERROR</button>
            </div>
            <label><span class="lbl">链路 ID</span>
              <span class="clear-field">
                <input type="text" id="trace-id" placeholder="链路 ID">
                <button type="button" id="trace-id-clear" class="clear-icon" title="清除" aria-label="清除链路 ID" hidden>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                  </svg>
                </button>
              </span>
            </label>
            <label><span class="lbl">关键词</span>
              <span class="clear-field">
                <input type="text" id="keyword" placeholder="如 timeout &amp;&amp; retry">
                <button type="button" id="keyword-clear" class="clear-icon" title="清除" aria-label="清除关键词" hidden>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                  </svg>
                </button>
              </span>
            </label>
            <details class="advanced-filters">
              <summary>更多筛选</summary>
              <label><span class="lbl">线程任务 ID</span>
                <span class="clear-field">
                  <input type="text" id="task-id" placeholder="线程任务 ID">
                  <button type="button" id="task-id-clear" class="clear-icon" title="清除" aria-label="清除线程任务 ID" hidden>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                  </button>
                </span>
              </label>
              <label><span class="lbl">MQ 消息 ID</span>
                <span class="clear-field">
                  <input type="text" id="message-id" placeholder="MQ 消息 ID">
                  <button type="button" id="message-id-clear" class="clear-icon" title="清除" aria-label="清除 MQ 消息 ID" hidden>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                  </button>
                </span>
              </label>
              <label><span class="lbl">SpanId</span>
                <span class="clear-field">
                  <input type="text" id="span-id" placeholder="SpanId">
                  <button type="button" id="span-id-clear" class="clear-icon" title="清除" aria-label="清除SpanId" hidden>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                  </button>
                </span>
              </label>
              <label><span class="lbl">ParentSpanId</span>
                <span class="clear-field">
                  <input type="text" id="parent-span-id" placeholder="ParentSpanId">
                  <button type="button" id="parent-span-id-clear" class="clear-icon" title="清除" aria-label="清除ParentSpanId" hidden>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                  </button>
                </span>
              </label>
            </details>
          </div>
        </div>
        <div class="sidebar-actions">
          <button type="button" id="search" aria-keyshortcuts="Enter">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
            </svg>
            查询日志
          </button>
        </div>
      </div>
    </aside>

    <section class="result-pane" aria-labelledby="result-title">
      <h2 id="result-title">查询结果</h2>
      <section id="error-bar" class="error" role="status" hidden></section>
      <div class="scroll-area" id="scroll-area">
        <section class="chart-wrap"><canvas id="chart" height="80"></canvas></section>
        <section id="results" class="results"></section>
      </div>
    </section>
  </main>
  <div id="query-loading" class="query-loading" role="status" aria-live="polite" hidden>
    <div class="query-loading-card">
      <span class="query-loading-spinner" aria-hidden="true"></span>
      <span>正在查询日志…</span>
    </div>
  </div>
  <script src="/static/js/levels.js"></script>
  <script src="/static/js/share.js"></script>
  <script src="/static/js/trace.js"></script>
  <script src="/static/js/keyboard.js"></script>
  <script src="/static/js/timeRange.js"></script>
  <script src="/static/js/pagination.js"></script>
  <script src="/static/js/display.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
